name: "designer_critique_instruction_stateful"
version: "1.0"
description: "Instructions for addressing critiques in stateful agent"
template_variables: ["instruction"]
# 2026-07-08 Modification reason: SceneBenchmark critic feedback should repair
# existing layout first and avoid duplicate primary furniture when fixing
# orientation, distance, clearance, support, or wall-backing issues.
# 2026-07-11 修改原因：critic 修复阶段不得把已靠侧墙的远端 guest chairs
# 再旋向 desk；它们应保持 wall-normal 朝内且同墙相互平行。
prompt: |
  Address the following feedback: {{ instruction }}

  ## SceneBenchmark Geometry Fix Strategy:
  - For orientation, distance, clearance, support, reachability, wall-backing, and
    facing feedback, FIRST repair the existing layout by moving, rotating,
    snapping, or proportionally rescaling the existing object named in the issue.
  - Do NOT add a new object to fix a geometry or orientation failure unless the
    critique explicitly says required furniture is missing or the prompt's
    required quantity is not met.
  - Preserve existing primary furniture roles. In living rooms, if a coffee_table,
    central table, tv_stand, or media_console already exists, do NOT add another
    coffee table, central support surface, TV stand, or media console just to fix
    seating orientation or support relationships.
  - When a support surface is poorly placed, move/rotate the existing support
    surface or the related seating/media object instead of creating a duplicate.
  - If the critique asks for an addition but the room already contains a matching
    primary furniture role, treat the task as a reposition/rotation/replacement
    problem and mention that choice in your final summary.
  - For remote guest/visitor chairs already assigned to a side wall, preserve the
    stable wall-backed topology: snap with `orientation="away"`, keep their fronts
    normal to the wall and same-wall chairs parallel. Do NOT rotate or validate those
    standalone chairs toward a desk/table. Only a chair within active desk-use distance
    (about 0.45m from the desk bounding box) should face the desk.

  ## Critique Resolution Workflow:
  1. Review the critique instructions provided by the planner
  2. Call observe_scene to see the current furniture arrangement
  3. **PRIORITIZE CRITICAL ISSUES**: If the critique mentions both critical issues AND
     optional suggestions (like "also consider angling..." or "could benefit from..."),
     address ONLY the critical issues first. Optional refinements can wait.
  4. Create specific fix TODOs for critical feedback only
  5. Implement the proposed solutions exactly as specified
  6. Use full object_ids (from get_current_scene_state) for operations
  7. **DO NOT move furniture that is correctly placed** - if storage furniture is against
     a wall where it belongs, leave it there even if the critique suggests repositioning
  8. Focus only on addressing critical feedback - avoid unrelated changes
  9. Complete TODOs systematically using designer_todo_manager
  10. Verify that your changes addressed the feedback with observe_scene before finishing
  11. Call check_physics after implementing fixes to ensure no new collisions were introduced
  12. If critique mentions passage blocking or reachability issues, use check_reachability
      to verify your fixes improved room traversability
  13. FINAL VERIFICATION: Before completing, confirm zero collisions exist. You MUST NOT
      finish while ANY collisions remain - resolve them first or remove objects.

  ## Return Format:
  Provide a summary including:
  - Which issues were addressed
  - Specific changes made (with coordinates)
  - How the fixes improve the design
  - How you verified that the changes addressed the feedback
